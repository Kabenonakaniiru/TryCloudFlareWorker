<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>グループ管理 - Daily Routine Manager</title>
  <link rel="stylesheet" href="/dist/client/styles/common.css">
  <link rel="stylesheet" href="/dist/client/styles/groups.css">
</head>

<body>
  <header class="app-header">
    <div class="header-container">
      <h1>🏷️ グループ管理</h1>
      <nav class="nav-links">
        <a href="/" class="nav-link">今日のルーチン</a>
        <a href="/rules.html" class="nav-link">ルール管理</a>
        <a href="/admin.html" class="nav-link admin-link">管理者ダッシュボード</a>
      </nav>
    </div>
  </header>

  <main class="main-container">
    <section class="register-section">
      <h3>新規グループ登録</h3>
      <div class="group-form">
        <div class="group-form-field flex-1">
          <label for="cat-slug">識別子 (スラッグ)</label>
          <input type="text" id="cat-slug" placeholder="e.g. kancolle">
        </div>
        <div class="group-form-field flex-1">
          <label for="cat-name">表示名</label>
          <input type="text" id="cat-name" placeholder="e.g. 🎮 艦これ">
        </div>
        <div class="group-form-field">
          <label for="cat-color">カラー</label>
          <div class="color-input-wrapper">
            <input type="color" id="cat-color" value="#3b82f6">
          </div>
        </div>
        <button id="add-cat-button">グループ追加</button>
      </div>
    </section>

    <section class="list-section">
      <h3>登録済みグループ一覧</h3>
      <div class="table-container">
        <table class="groups-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>識別子</th>
              <th>表示名</th>
              <th>カラー</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="cat-list-body">
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/dist/client/groups.js"></script>
</body>

</html>
