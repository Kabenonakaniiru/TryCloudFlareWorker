<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <title>カテゴリマスタ管理</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>
  <h1>🏷️ カテゴリマスタ管理</h1>
  <nav><a href="/">🏠 メインへ戻る</a></nav>

  <section style="margin-top: 20px; border: 1px solid #ccc; padding: 15px;">
    <h3>新規カテゴリ登録</h3>
    <div class="form-group">
      <input type="text" id="cat-slug" placeholder="識別子 (e.g. kancolle)">
      <input type="text" id="cat-name" placeholder="表示名 (e.g. 艦これ)">
      <input type="color" id="cat-color" value="#3b82f6">
      <button id="add-cat-button">追加</button>
    </div>
  </section>

  <hr>

  <h3>登録済みカテゴリ一覧</h3>
  <table border="1" style="width: 100%; border-collapse: collapse;">
    <thead>
      <tr style="background: #f4f4f4;">
        <th>ID</th>
        <th>識別子</th>
        <th>表示名</th>
        <th>カラー</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="cat-list-body">
    </tbody>
  </table>

  <script>
    const loadCategories = async () => {
      const res = await fetch('/api/groups');
      const data = await res.json();
      const body = document.getElementById('cat-list-body');
      body.innerHTML = data.map(c => `
        <tr>
          <td>${c.id}</td>
          <td>${c.slug}</td>
          <td>${c.name}</td>
          <td><span style="display:inline-block; width:20px; height:20px; background:${c.color}; border:1px solid #000;"></span> ${c.color}</td>
          <td><button onclick="deleteCategory(${c.id})">削除</button></td>
        </tr>
      `).join('');
    };

    document.getElementById('add-cat-button').onclick = async () => {
      const slug = document.getElementById('cat-slug').value;
      const name = document.getElementById('cat-name').value;
      const color = document.getElementById('cat-color').value;

      await fetch('/api/groups', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ slug, name, color })
      });
      loadCategories(); // 再読み込み
    };

    window.deleteCategory = async (id) => {
      if (!confirm('削除しますか？')) return;
      await fetch(`/api/groups/${id}`, {
        method: 'DELETE'
      });
      loadCategories();
    };

    loadCategories();
  </script>
</body>

</html>
