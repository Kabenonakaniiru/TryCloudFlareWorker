<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>Google Calendar Test</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>
  <h1>📅 本日のカレンダー疎通確認</h1>
  <nav><a href="/" class="btn-link">← 戻る</a></nav>

  <div id="status">通信中...</div>
  <ul id="event-list"></ul>

  <script>
    async function testCalendar() {
      const status = document.getElementById('status');
      const list = document.getElementById('event-list');

      try {
        const resp = await fetch('/api/calendar-test');
        const data = await resp.json();

        if (data.items) {
          status.textContent = `取得成功: ${data.items.length}件の予定があります`;
          data.items.forEach(item => {
            const li = document.createElement('li');
            li.textContent = `${item.start.dateTime || item.start.date} : ${item.summary}`;
            list.appendChild(li);
          });
        } else {
          status.textContent = "エラー: " + JSON.stringify(data);
        }
      } catch (err) {
        status.textContent = "通信失敗: " + err.message;
      }
    }
    testCalendar();
  </script>
</body>

</html>
