<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>タスクマスタ管理 - ソシャゲツール</title>
  <link rel="stylesheet" href="/dist/client/styles/common.css">
  <link rel="stylesheet" href="/dist/client/styles/rules.css">
</head>

<body>
  <h1>📋 ソシャゲタスクルール設定（マスタ管理）</h1>
  <nav>
    <a href="/" class="btn-link">← メインへ戻る</a>
    <a href="/todo" class="btn-link btn-todo">👉 日々のTODO画面へ</a>
  </nav>

  <section class="task-form">
    <div class="form-group">
      <label for="task-title">タスク名</label>
      <input type="text" id="task-title" placeholder="例: デイリー南西諸島海域クリア">
    </div>
    <div class="form-group">
      <label for="task-category">カテゴリ</label>
      <select id="task-category">
        <option value="">未選択</option>
      </select>
    </div>
    <div class="form-group">
      <label for="task-schedule-type">スケジュール種別</label>
      <select id="task-schedule-type">
        <option value="none">なし (手動発生)</option>
        <option value="daily">日次 (毎日発生)</option>
        <option value="period">期間指定 (イベント・限定任務)</option>
      </select>
    </div>

    <div id="schedule-details"></div>

    <div class="form-group">
      <label for="task-reset-time">リセット時間</label>
      <input type="time" id="task-reset-time" value="02:00">
      <small class="help-text">※ この時間を過ぎると翌日扱いになります (例: 艦これ等は02:00)</small>
    </div>

    <div class="form-group">
      <label for="task-missed-behavior">未完了で翌朝を迎えた時の挙動</label>
      <select id="task-missed-behavior">
        <option value="delete">【モードA】強制リセット（前日分はサボり判定にして本日分を新設）</option>
        <option value="keep">【モードB】累積・繰り越し（完了するまで今日のカレンダーへスライド）</option>
      </select>
    </div>

    <div class="form-group">
      <label for="task-notes">備考・メモ</label>
      <textarea id="task-notes" placeholder="編成条件やトリガー任務など" rows="2"></textarea>
    </div>

    <div class="form-actions">
      <button type="button" id="add-task-button">ルールを追加する</button>
      <button type="button" id="cancel-edit-button" class="hidden">キャンセル</button>
    </div>
  </section>

  <table>
    <thead>
      <tr>
        <th>タイトル</th>
        <th>カテゴリ</th>
        <th>リセット</th>
        <th>スケジュール / 期間</th>
        <th>未完了時</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="task-list"></tbody>
  </table>

  <div id="scope-modal" class="modal">
    <div class="modal-content">
      <h3 id="modal-title">カレンダー連動設定</h3>
      <p class="modal-task-target">対象タスク: <span id="modal-task-name" class="target-task-name">-</span></p>
      <p id="modal-desc" class="modal-desc">Googleカレンダーの変更・削除範囲を選択してください：</p>
      <div class="radio-group">
        <label><input type="radio" name="operation-scope" value="future" checked> 今日以降の予定のみ対象</label>
        <label><input type="radio" name="operation-scope" value="all"> 過去分を含む全期間（一括対象）</label>
      </div>
      <div class="modal-actions">
        <button id="modal-confirm-btn" class="edit-btn">確定</button>
        <button id="modal-cancel-btn" class="delete-btn">キャンセル</button>
      </div>
    </div>
  </section>
  </div>

  <script src="/dist/client/rules.js"></script>
</body>

</html>
