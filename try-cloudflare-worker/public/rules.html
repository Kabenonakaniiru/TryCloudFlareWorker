<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>タスクマスタ管理 - ソシャゲツール</title>
  <link rel="stylesheet" href="/dist/client/styles/common.css">
  <link rel="stylesheet" href="/dist/client/styles/rules.css">
</head>

<body>
  <h1>📋 ソシャゲタスクルール設定（マスタ管理）</h1>
  <nav>
    <a href="/" class="btn-link">← メインへ戻る</a>
    <a href="/todo" class="btn-link" style="background-color: #2ecc71; margin-left: 10px;">👉 日々のTODO画面へ</a>
  </nav>

  <section class="task-form">
    <div class="form-group">
      <label for="task-title">タスク名</label>
      <input type="text" id="task-title" placeholder="例: デイリー南西諸島海域クリア">
    </div>
    <div class="form-group">
      <label for="task-category">カテゴリ</label>
      <select id="task-category">
        <option value="">未選択</option>
      </select>
    </div>
    <div class="form-group">
      <label for="task-schedule-type">スケジュール種別</label>
      <select id="task-schedule-type">
        <option value="none">なし (手動発生)</option>
        <option value="daily">日次 (毎日発生)</option>
        <option value="period">期間指定 (イベント・限定任務)</option>
      </select>
    </div>

    <div id="schedule-details"></div>

    <div class="form-group">
      <label for="task-reset-time">リセット時間</label>
      <input type="time" id="task-reset-time" value="02:00">
      <small style="color:#666; display:block; margin-top:2px;">※ この時間を過ぎると翌日扱いになります (例: 艦これ等は02:00)</small>
    </div>

    <div class="form-group">
      <label for="task-missed-behavior">未完了で翌朝を迎えた時の挙動</label>
      <select id="task-missed-behavior">
        <option value="delete">【モードA】強制リセット（前日分はサボり判定にして本日分を新設）</option>
        <option value="keep">【モードB】累積・繰り越し（完了するまで今日のカレンダーへスライド）</option>
      </select>
    </div>

    <div class="form-group">
      <label for="task-notes">備考・メモ</label>
      <textarea id="task-notes" placeholder="編成条件やトリガー任務など" rows="2"
        style="width:100%; padding:8px; border-radius:4px; border:1px solid #ccc; font-family:inherit;"></textarea>
    </div>

    <div class="form-actions">
      <button type="button" id="add-task-button">ルールを追加する</button>
      <button type="button" id="cancel-edit-button" style="display:none; margin-left: 10px;">キャンセル</button>
    </div>
  </section>

  <table>
    <thead>
      <tr>
        <th>タイトル</th>
        <th>カテゴリ</th>
        <th>リセット</th>
        <th>スケジュール / 期間</th>
        <th>未完了時</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="task-list"></tbody>
  </table>

  <div id="scope-modal" class="modal">
    <div class="modal-content">
      <h3 id="modal-title">カレンダー連動設定</h3>
      <p style="margin-bottom: 5px;">対象タスク: <span id="modal-task-name" class="target-task-name">-</span></p>
      <p id="modal-desc" style="font-size: 0.95em; color: #666;">Googleカレンダーの変更・削除範囲を選択してください：</p>
      <div class="radio-group">
        <label><input type="radio" name="operation-scope" value="future" checked> 今日以降の予定のみ対象</label>
        <label><input type="radio" name="operation-scope" value="all"> 過去分を含む全期間（一括対象）</label>
      </div>
      <div class="modal-actions">
        <button id="modal-confirm-btn" class="edit-btn">確定</button>
        <button id="modal-cancel-btn" class="delete-btn">キャンセル</button>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const taskBtn = document.getElementById('add-task-button');
      const cancelEditBtn = document.getElementById('cancel-edit-button');
      const taskList = document.getElementById('task-list');
      const scheduleTypeSelect = document.getElementById('task-schedule-type');
      const categorySelect = document.getElementById('task-category');

      const scopeModal = document.getElementById('scope-modal');
      const modalTitle = document.getElementById('modal-title');
      const modalTaskName = document.getElementById('modal-task-name');
      const modalDesc = document.getElementById('modal-desc');
      const modalConfirmBtn = document.getElementById('modal-confirm-btn');
      const modalCancelBtn = document.getElementById('modal-cancel-btn');

      let currentTasks = [];
      let editTaskId = null;
      let pendingOperation = null;

      function formatSchedule(task) {
        if (task.interval === 'daily') {
          return '🔄 毎日自動発生';
        } else if (task.interval === 'period') {
          const style = task.periodStyle === 'routine' ? '期間中毎日' : '期間中1回のみ';
          return `📅 期間指定 (${style})<br><small>${task.startAt || '-'} ～ ${task.endAt || '-'}</small>`;
        }
        return '📑 手動発生のみ';
      }

      async function loadTasks() {
        try {
          const resp = await fetch('/api/rules');
          if (!resp.ok) throw new Error('マスタ一覧の取得に失敗しました');
          const tasks = await resp.json();
          currentTasks = tasks;
          taskList.innerHTML = '';
          tasks.forEach(task => {
            const row = `
              <tr>
                <td>
                  <strong>${task.title}</strong>
                  ${task.notes ? `<br><small style="color:#777;">📝 ${task.notes}</small>` : ''}
                </td>
                <td>${task.group ? `<span style="color: ${task.group.color}">${task.group.name}</span>` : '-'}</td>
                <td>⏱️ ${task.resetTime}</td>
                <td>${formatSchedule(task)}</td>
                <td>
                  ${task.missedBehavior === 'keep'
                ? '<span class="status-badge" style="background-color:#f39c12;">↩️ 翌日繰越</span>'
                : '<span class="status-badge" style="background-color:#95a5a6;">❌ 強制リセット</span>'}
                </td>
                <td>
                  <button class="edit-btn" onclick="editTask(${task.id})">編集</button>
                  <button class="delete-btn" onclick="triggerDelete(${task.id})">削除</button>
                </td>
              </tr>
            `;
            taskList.insertAdjacentHTML('beforeend', row);
          });
        } catch (err) { console.error(err); }
      }

      async function loadCategories() {
        try {
          const resp = await fetch('/api/groups');
          if (!resp.ok) throw new Error('カテゴリ一覧の取得に失敗しました');
          const categories = await resp.json();
          categorySelect.innerHTML = '<option value="">未選択</option>';
          categories.forEach(category => {
            const option = document.createElement('option');
            option.value = category.id;
            option.textContent = category.name;
            option.style.color = category.color;
            categorySelect.appendChild(option);
          });
        } catch (err) { console.error(err); }
      }

      function renderScheduleDetails() {
        const container = document.getElementById('schedule-details');
        const scheduleType = scheduleTypeSelect.value;
        const htmlParts = [];

        if (scheduleType === 'period') {
          htmlParts.push(`
            <div class="form-group" style="background: #f9f9f9; padding: 10px; border-radius: 4px; margin-bottom: 15px;">
              <div style="margin-bottom: 10px;">
                <label for="task-period-style">期間内の消化スタイル</label>
                <select id="task-period-style">
                  <option value="routine">期間中、毎日リセットして発生 (限定日課)</option>
                  <option value="single">期間中に合計1回クリアすればOK (単発任務)</option>
                </select>
              </div>
              <div style="display: flex; gap: 10px;">
                <div style="flex: 1;">
                  <label for="task-start">開始日</label>
                  <input type="date" id="task-start">
                </div>
                <div style="flex: 1;">
                  <label for="task-end">終了日</label>
                  <input type="date" id="task-end">
                </div>
              </div>
            </div>
          `);
        }
        container.innerHTML = htmlParts.join('');
      }

      function resetForm() {
        editTaskId = null;
        taskBtn.textContent = 'ルールを追加する';
        cancelEditBtn.style.display = 'none';
        document.getElementById('task-title').value = '';
        document.getElementById('task-notes').value = '';
        document.getElementById('task-reset-time').value = '02:00';
        document.getElementById('task-missed-behavior').value = 'delete';
        categorySelect.value = '';
        scheduleTypeSelect.value = 'none';
        renderScheduleDetails();
      }

      function openScopeModal(taskTitle, title, desc, onConfirm) {
        modalTitle.textContent = title;
        modalTaskName.textContent = taskTitle;
        modalDesc.textContent = desc;
        pendingOperation = onConfirm;
        document.querySelector('input[name="operation-scope"][value="future"]').checked = true;
        scopeModal.style.display = 'block';
      }

      modalCancelBtn.addEventListener('click', () => {
        scopeModal.style.display = 'none';
        pendingOperation = null;
      });

      modalConfirmBtn.addEventListener('click', () => {
        const scope = document.querySelector('input[name="operation-scope"]:checked').value;
        if (pendingOperation) pendingOperation(scope);
        scopeModal.style.display = 'none';
        pendingOperation = null;
      });

      taskBtn.addEventListener('click', async () => {
        const title = document.getElementById('task-title').value;
        if (!title) { alert('タスク名を入力してください'); return; }

        const scheduleType = scheduleTypeSelect.value;
        let startAt = null;
        let endAt = null;
        let periodStyle = null;

        if (scheduleType === 'period') {
          startAt = document.getElementById('task-start').value || null;
          endAt = document.getElementById('task-end').value || null;
          periodStyle = document.getElementById('task-period-style').value;
        }

        const payload = {
          title,
          groupId: categorySelect.value ? Number(categorySelect.value) : null,
          interval: scheduleType,
          periodStyle,
          startAt,
          endAt,
          resetTime: document.getElementById('task-reset-time').value,
          missedBehavior: document.getElementById('task-missed-behavior').value,
          notes: document.getElementById('task-notes').value || null,
        };

        if (editTaskId) {
          openScopeModal(title, 'ルール更新の反映範囲', 'このルールの変更に伴い、連動するGoogleカレンダーの予定をどう処理しますか？', async (scope) => {
            try {
              const resp = await fetch(`/api/rules/${editTaskId}?target=${scope}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
              });
              if (resp.ok) { resetForm(); await loadTasks(); }
              else { alert('更新に失敗しました: ' + await resp.text()); }
            } catch (err) { console.error(err); }
          });
        } else {
          try {
            const resp = await fetch('/api/rules', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload),
            });
            if (resp.ok) { resetForm(); await loadTasks(); }
            else { alert('追加に失敗しました: ' + await resp.text()); }
          } catch (err) { console.error(err); }
        }
      });

      scheduleTypeSelect.addEventListener('change', renderScheduleDetails);
      cancelEditBtn.addEventListener('click', resetForm);

      window.editTask = function (id) {
        const task = currentTasks.find((task) => task.id === id);
        if (!task) return;
        editTaskId = task.id;
        taskBtn.textContent = 'ルールを更新する';
        cancelEditBtn.style.display = 'inline-block';

        document.getElementById('task-title').value = task.title || '';
        document.getElementById('task-notes').value = task.notes || '';
        document.getElementById('task-reset-time').value = task.resetTime || '02:00';
        document.getElementById('task-missed-behavior').value = task.missedBehavior || 'delete';
        categorySelect.value = task.groupId || '';
        scheduleTypeSelect.value = task.interval || 'none';

        renderScheduleDetails();

        if (task.interval === 'period') {
          document.getElementById('task-period-style').value = task.periodStyle || 'routine';
          document.getElementById('task-start').value = task.startAt || '';
          document.getElementById('task-end').value = task.endAt || '';
        }
      };

      window.triggerDelete = function (id) {
        const task = currentTasks.find((task) => task.id === id);
        if (!task) return;

        openScopeModal(task.title, 'ルールの削除確認', 'ルールを削除すると、紐づく日々の未完了TODOも削除されます。カレンダー連携の処理範囲を選択してください：', async (scope) => {
          try {
            const resp = await fetch(`/api/rules/${id}?target=${scope}`, { method: 'DELETE' });
            if (resp.ok) { await loadTasks(); }
            else { alert('削除に失敗しました'); }
          } catch (err) { console.error(err); }
        });
      };

      // 初期化
      renderScheduleDetails();
      loadTasks();
      loadCategories();
    });
  </script>
</body>

</html>
