<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>タスク管理 - ソシャゲツール</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    /* モーダルダイアログのスタイル */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
    }

    .modal-content {
      background-color: #fff;
      margin: 15% auto;
      padding: 20px;
      border-radius: 5px;
      width: 400px;
      text-align: center;
    }

    .modal-actions {
      margin-top: 20px;
      display: flex;
      justify-content: space-around;
    }

    .radio-group {
      margin: 15px 0;
      text-align: left;
      padding-left: 50px;
    }

    .radio-group label {
      display: block;
      margin-bottom: 8px;
      cursor: pointer;
    }

    .target-task-name {
      display: inline-block;
      background-color: #f0f0f0;
      padding: 4px 10px;
      border-radius: 4px;
      font-weight: bold;
      color: #333;
      margin: 5px 0;
    }

  </style>
</head>

<body>
  <h1>📋 ソシャゲタスク管理</h1>
  <nav>
    <a href="/" class="btn-link">← メインへ戻る</a>
  </nav>

  <section class="task-form">
    <div class="form-group">
      <label for="task-title">タスク名</label>
      <input type="text" id="task-title" placeholder="例: デイリークエスト">
    </div>
    <div class="form-group">
      <label for="task-category">カテゴリ</label>
      <select id="task-category">
        <option value="">未選択</option>
      </select>
    </div>
    <div class="form-group">
      <label for="task-schedule-type">スケジュール種別</label>
      <select id="task-schedule-type">
        <option value="none">なし</option>
        <option value="daily">日次</option>
        <option value="weekly">週次</option>
        <option value="monthly">月次</option>
        <option value="seasonal">季間</option>
        <option value="yearly">年次</option>
        <option value="period">期間指定</option>
      </select>
    </div>
    <div id="schedule-details"></div>

    <div class="form-actions">
      <button type="button" id="add-task-button">追加する</button>
      <button type="button" id="cancel-edit-button" style="display:none; margin-left: 10px;">キャンセル</button>
    </div>
  </section>

  <table>
    <thead>
      <tr>
        <th>タイトル</th>
        <th>カテゴリ</th>
        <th>期間</th>
        <th>繰り返し</th>
        <th>状態</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="task-list"></tbody>
  </table>

  <div id="scope-modal" class="modal">
    <div class="modal-content">
      <h3 id="modal-title">カレンダー連動設定</h3>
      <p style="margin-bottom: 5px;">対象タスク: <span id="modal-task-name" class="target-task-name">-</span></p>
      <p id="modal-desc" style="font-size: 0.95em; color: #666;">Googleカレンダーの変更・削除範囲を選択してください：</p>
      <div class="radio-group">
        <label><input type="radio" name="operation-scope" value="future" checked> 今日以降の予定のみ対象</label>
        <label><input type="radio" name="operation-scope" value="all"> 過去分を含む全期間（一括対象）</label>
      </div>
      <div class="modal-actions">
        <button id="modal-confirm-btn" class="edit-btn">確定</button>
        <button id="modal-cancel-btn" class="delete-btn">キャンセル</button>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const taskBtn = document.getElementById('add-task-button');
      const cancelEditBtn = document.getElementById('cancel-edit-button');
      const taskList = document.getElementById('task-list');
      const scheduleTypeSelect = document.getElementById('task-schedule-type');
      const categorySelect = document.getElementById('task-category');

      const scopeModal = document.getElementById('scope-modal');
      const modalTitle = document.getElementById('modal-title');
      const modalTaskName = document.getElementById('modal-task-name');
      const modalDesc = document.getElementById('modal-desc');
      const modalConfirmBtn = document.getElementById('modal-confirm-btn');
      const modalCancelBtn = document.getElementById('modal-cancel-btn');

      let currentTasks = [];
      let editTaskId = null;
      let pendingOperation = null;

      function formatSchedule(task) {
        let scheduleData = {};
        if (task.schedule_data) {
          try { scheduleData = JSON.parse(task.schedule_data); } catch { scheduleData = {}; }
        }
        switch (task.interval) {
          case 'daily':
            return `${scheduleData.start_at ? scheduleData.start_at.replace('T', ' ') : '-'} (連動: ${scheduleData.count || 1}日間)`;
          default: return `${(task.start_at || '-').replace('T', ' ')} <br> ${(task.end_at || '-').replace('T', ' ')}`;
        }
      }

      async function loadTasks() {
        try {
          const resp = await fetch('/api/tasks');
          if (!resp.ok) throw new Error('一覧の取得に失敗しました');
          const tasks = await resp.json();
          currentTasks = tasks;
          taskList.innerHTML = '';
          tasks.forEach(task => {
            const row = `
              <tr>
                <td><strong>${task.title}</strong></td>
                <td>${task.category ? `<span style="color: ${task.category.color}">${task.category.name}</span>` : '-'}</td>
                <td>${formatSchedule(task)}</td>
                <td>${task.interval || 'なし'}</td>
                <td><span class="status-badge">${task.status}</span></td>
                <td>
                  <button class="edit-btn" onclick="editTask(${task.id})">編集</button>
                  <button class="delete-btn" onclick="triggerDelete(${task.id})">削除</button>
                </td>
              </tr>
            `;
            taskList.insertAdjacentHTML('beforeend', row);
          });
        } catch (err) { console.error(err); }
      }

      async function loadCategories() {
        try {
          const resp = await fetch('/api/categories');
          if (!resp.ok) throw new Error('カテゴリ一覧の取得に失敗しました');
          const categories = await resp.json();
          categorySelect.innerHTML = '<option value="">未選択</option>';
          categories.forEach(category => {
            const option = document.createElement('option');
            option.value = category.id;
            option.textContent = category.name;
            option.style.color = category.color;
            categorySelect.appendChild(option);
          });
        } catch (err) { console.error(err); }
      }

      function renderScheduleDetails() {
        const container = document.getElementById('schedule-details');
        const scheduleType = scheduleTypeSelect.value;
        const htmlParts = [];

        if (scheduleType === 'daily') {
          htmlParts.push(`
            <div class="form-group">
              <label for="daily-start">開始日時</label>
              <input type="datetime-local" id="daily-start">
            </div>
            <div class="form-group">
              <label for="daily-count">生成日数</label>
              <input type="number" id="daily-count" min="1" max="31" value="1">
            </div>
          `);
        } else {
          htmlParts.push(`
            <div class="form-group">
              <label for="task-start">開始</label>
              <input type="datetime-local" id="task-start">
            </div>
            <div class="form-group">
              <label for="task-end">終了</label>
              <input type="datetime-local" id="task-end">
            </div>
          `);
        }
        container.innerHTML = htmlParts.join('');
      }

      function getSchedulePayload(scheduleType) {
        if (scheduleType === 'daily') {
          return {
            interval: 'daily',
            schedule_data: {
              start_at: document.getElementById('daily-start').value,
              count: Number(document.getElementById('daily-count').value || 1),
            },
          };
        }
        return {
          interval: 'none',
          start_at: document.getElementById('task-start')?.value,
          end_at: document.getElementById('task-end')?.value,
        };
      }

      function resetForm() {
        editTaskId = null;
        taskBtn.textContent = '追加する';
        cancelEditBtn.style.display = 'none';
        document.getElementById('task-title').value = '';
        categorySelect.value = '';
        scheduleTypeSelect.value = 'none';
        renderScheduleDetails();
      }

      function openScopeModal(taskTitle, title, desc, onConfirm) {
        modalTitle.textContent = title;
        modalTaskName.textContent = taskTitle;
        modalDesc.textContent = desc;
        pendingOperation = onConfirm;
        document.querySelector('input[name="operation-scope"][value="future"]').checked = true;
        scopeModal.style.display = 'block';
      }

      modalCancelBtn.addEventListener('click', () => {
        scopeModal.style.display = 'none';
        pendingOperation = null;
      });

      modalConfirmBtn.addEventListener('click', () => {
        const scope = document.querySelector('input[name="operation-scope"]:checked').value;
        if (pendingOperation) pendingOperation(scope);
        scopeModal.style.display = 'none';
        pendingOperation = null;
      });

      taskBtn.addEventListener('click', async () => {
        const title = document.getElementById('task-title').value;
        if (!title) { alert('タスク名を入力してください'); return; }

        const scheduleType = scheduleTypeSelect.value;
        const schedulePayload = getSchedulePayload(scheduleType);

        const payload = {
          title,
          categoryId: categorySelect.value || null,
          interval: scheduleType,
          ...schedulePayload,
        };

        if (editTaskId) {
          openScopeModal(title, 'タスク更新の反映範囲', 'このタスクの変更をどの範囲のカレンダー予定に反映しますか？', async (scope) => {
            try {
              const resp = await fetch(`/api/tasks/${editTaskId}?target=${scope}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
              });
              if (resp.ok) { resetForm(); await loadTasks(); }
              else { alert('更新に失敗しました: ' + await resp.text()); }
            } catch (err) { console.error(err); }
          });
        } else {
          try {
            const resp = await fetch('/api/tasks', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload),
            });
            if (resp.ok) { resetForm(); await loadTasks(); }
            else { alert('追加に失敗しました: ' + await resp.text()); }
          } catch (err) { console.error(err); }
        }
      });

      scheduleTypeSelect.addEventListener('change', renderScheduleDetails);
      cancelEditBtn.addEventListener('click', resetForm);

      window.editTask = function (id) {
        const task = currentTasks.find((task) => task.id === id);
        if (!task) return;
        editTaskId = task.id;
        taskBtn.textContent = '更新する';
        cancelEditBtn.style.display = 'inline-block';
        document.getElementById('task-title').value = task.title;
        categorySelect.value = task.categoryId || '';
        scheduleTypeSelect.value = task.interval || 'none';
        renderScheduleDetails();

        let scheduleData = {};
        if (task.schedule_data) {
          try { scheduleData = JSON.parse(task.schedule_data); } catch { scheduleData = {}; }
        }
        if (task.interval === 'daily') {
          document.getElementById('daily-start').value = scheduleData.start_at || '';
          document.getElementById('daily-count').value = scheduleData.count || 1;
        } else {
          document.getElementById('task-start').value = task.start_at || '';
          document.getElementById('task-end').value = task.end_at || '';
        }
      };

      window.triggerDelete = function (id) {
        const task = currentTasks.find((task) => task.id === id);
        if (!task) return;

        openScopeModal(task.title, 'タスク削除の確認', 'このタスクと連動しているGoogleカレンダーの削除範囲を選択してください：', async (scope) => {
          try {
            const resp = await fetch(`/api/tasks/${id}?target=${scope}`, { method: 'DELETE' });
            if (resp.ok) { await loadTasks(); }
            else { alert('削除に失敗しました'); }
          } catch (err) { console.error(err); }
        });
      };

      // 初期化処理
      renderScheduleDetails();
      loadTasks();
      loadCategories();
    });
  </script>
</body>

</html>
