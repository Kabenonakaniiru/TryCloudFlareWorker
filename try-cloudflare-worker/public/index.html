<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Daily Routine Manager - 今日のルーチン</title>
	<link rel="stylesheet" href="/dist/client/styles/common.css">
	<link rel="stylesheet" href="/dist/client/styles/index.css">
</head>

<body>
	<header class="app-header">
		<div class="header-container">
			<h1>今日のルーチン</h1>
			<nav class="nav-links">
				<a href="/rules.html" class="nav-link">ルール管理</a>
				<a href="/groups.html" class="nav-link">グループ管理</a>
				<a href="/admin.html" class="nav-link admin-link">管理者ダッシュボード</a>
			</nav>
		</div>
	</header>

	<main class="main-container">
		<!-- 進捗インジケーター -->
		<section class="progress-section">
			<div class="progress-header">
				<span class="progress-title">本日の進捗状況</span>
				<span id="progress-text" class="progress-text">0 / 0 (0%)</span>
			</div>
			<div class="progress-bar-container">
				<div id="progress-bar-fill" class="progress-bar-fill" style="width: 0%;"></div>
			</div>
		</section>

		<!-- グループフィルタータブ & クイック追加 -->
		<section class="filter-section">
			<div class="filter-header">
				<div id="group-filter-tabs" class="filter-tabs"></div>
				<button id="open-quick-add-btn" class="btn-quick-add" title="新しいルールを迅速に追加">+ ルール追加</button>
			</div>
		</section>

		<!-- TODOタスク一覧 -->
		<section class="task-section">
			<div id="log-list" class="log-list"></div>
		</section>

		<!-- クイック追加モーダル -->
		<div id="quick-add-modal" class="modal-overlay" style="display: none;">
			<div class="modal-card">
				<div class="modal-header">
					<h3>新規ルーチンルールの追加</h3>
					<button id="close-quick-add-btn" class="btn-close">&times;</button>
				</div>
				<form id="quick-add-form" class="modal-body">
					<div class="form-group">
						<label for="quick-title">タスク名 <span class="required">*</span></label>
						<input type="text" id="quick-title" required placeholder="例: デイリークエスト達成">
					</div>
					<div class="form-group">
						<label for="quick-group">グループ</label>
						<select id="quick-group"></select>
					</div>
					<div class="form-group">
						<label for="quick-notes">メモ・詳細</label>
						<input type="text" id="quick-notes" placeholder="例: スタミナ消費も忘れずに">
					</div>
					<div class="form-row">
						<div class="form-group half">
							<label for="quick-uncompleted-mode">未完了時</label>
							<select id="quick-uncompleted-mode">
								<option value="delete">リセット (delete)</option>
								<option value="slide">繰り越し (slide)</option>
							</select>
						</div>
						<div class="form-group half">
							<label for="quick-reset-time">リセット時刻</label>
							<input type="time" id="quick-reset-time" value="04:00">
						</div>
					</div>
					<div class="modal-footer">
						<button type="button" id="cancel-quick-add-btn" class="btn-secondary">キャンセル</button>
						<button type="submit" class="btn-primary">追加して生成</button>
					</div>
				</form>
			</div>
		</div>
	</main>

	<script type="module" src="/dist/client/index.js"></script>
</body>

</html>
